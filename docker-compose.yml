services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: demandflow-ml-backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - ENVIRONMENT=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: demandflow-web
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
